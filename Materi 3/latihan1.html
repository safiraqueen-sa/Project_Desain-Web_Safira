<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin dan Padding</title>
    <style>
        .satu{
            border: 1px solid black;
            background-color: aquamarine;
            font: 1em verdana;
            margin-top: 40px;
            margin-right: 50px;
            margin-bottom: 60px;
            margin-left: 30px;
        }
        .dua{
            border: 1px solid rgb(10, 10, 10);
            background-color: rgb(13, 117, 83);
            padding: 40px;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <center><div class="satu"><h3>
        Partisi ini memiliki margin atas 40px, kanan 50px, bawah 60px, kiri 30px
    </h3></div><br>
    <div class="dua">
        Sedangkan ini memiliki Padding atas, kanan, bawah, kiri 40 px
    </div>
    <br><button><a href="latihan2.html">Latihan 2</a></button>
    </center>
</body>
</html>
